name: Boundary Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  boundary-checks:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for forbidden runtime logic
      run: |
        echo "Checking for forbidden runtime domain leakage in seller-dashboard..."
        
        # For UI layer, we only check for direct database access
        # and server-side runtime logic
        FORBIDDEN_PATTERNS=(
          "prisma.*order"
          "prisma.*payment"
          "prisma.*inventory"
          "order.*create"
          "payment.*process"
          "auth.*login"
          "jwt.*sign"
          "server.*listen"
          "express.*"
          "fastify.*"
        )
        
        VIOLATIONS_FOUND=false
        
        for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
          echo "Checking pattern: $pattern"
          if grep -r "$pattern" src/ --include="*.ts" --include="*.js" --include="*.tsx" --include="*.jsx"; then
            echo "VIOLATION: Found forbidden pattern '$pattern'"
            VIOLATIONS_FOUND=true
          fi
        done
        
        if [ "$VIOLATIONS_FOUND" = true ]; then
          echo "BOUNDARY VIOLATIONS FOUND"
          exit 1
        else
          echo "No boundary violations found"
        fi
